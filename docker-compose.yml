services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  backend:
    image: edu-video-backend:latest
    build: ./backend
    env_file: .env
    environment:
      # 容器里通过服务名访问数据库和 Redis，覆盖 .env 里给本地开发用的 localhost 地址
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      TEMP_DIR: /tmp
      RENDERER_URL: http://renderer:8010
      PPT_RENDERER_URL: http://ppt-renderer:8010
    networks:
      - default
      - render_internal
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700,size=768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    # 不映射端口：只有 frontend 里的 nginx 能访问后端
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address :9001
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - materials:/data
    restart: unless-stopped

  worker:
    image: edu-video-backend:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      TEMP_DIR: /tmp
      RENDERER_URL: http://renderer:8010
      PPT_RENDERER_URL: http://ppt-renderer:8010
    networks:
      - default
      - render_internal
    command: celery -A app.jobs.celery_app:celery_app worker --loglevel=warning --concurrency=2
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700,size=768m
    depends_on:
      backend:
        condition: service_healthy
      renderer:
        condition: service_healthy
      ppt-renderer:
        condition: service_healthy
    restart: unless-stopped

  renderer:
    init: true
    image: edu-video-renderer:latest
    build:
      context: .
      dockerfile: renderer/Dockerfile
    environment:
      HOME: /tmp
    networks:
      - render_internal
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    shm_size: 256m
    tmpfs:
      - /tmp:uid=10002,gid=10002,mode=0700,size=768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ppt-renderer:
    init: true
    image: edu-video-renderer:latest
    environment:
      HOME: /tmp
    networks:
      - render_internal
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    shm_size: 256m
    tmpfs:
      - /tmp:uid=10002,gid=10002,mode=0700,size=768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  scheduler:
    image: edu-video-backend:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.jobs.celery_app:celery_app beat --loglevel=warning --schedule=/tmp/celerybeat-schedule
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700,size=32m
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  materials:

networks:
  render_internal:
    internal: true
