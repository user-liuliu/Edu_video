[project]
name = "edu-video-backend"
version = "0.1.0"
description = "教学视频 agent 网站后端"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "celery==5.6.3",
    "cryptography>=50.0.2",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langchain-openai==1.7.2",
    "langgraph==1.2.15",
    "langgraph-checkpoint-postgres==3.2.0",
    "minio==7.2.20",
    "olefile==0.47",
    "pillow==12.3.0",
    "psycopg[binary,pool]==3.3.6",
    "pydantic-settings>=2.16.0",
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "python-pptx==1.0.2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
