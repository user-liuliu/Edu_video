<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>教学图标 · 教学视频助手</title><style>
*{box-sizing:border-box}body{margin:0;color:#344158;background:#fbfcfe;font:14px/1.7 'Segoe UI','Microsoft YaHei',sans-serif}button,a{font:inherit;cursor:pointer}button{color:inherit}button:focus-visible,a:focus-visible{outline:2px solid #3979dc;outline-offset:4px}a{color:#6d86ac;text-decoration:none}.page{max-width:1160px;padding:32px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:24px;border-bottom:1px solid #e5ebf3}header b{font-size:16px;font-weight:600}header a{font-size:12px}h1{font-size:28px;font-weight:500;margin:35px 0 9px}p{color:#8693a6;margin:0;font-size:13px}.tools{display:flex;gap:15px;align-items:center;margin:28px 0 20px;color:#8090a8;font-size:12px}.tools button{border:1px solid #e1e8f3;background:white;border-radius:8px;padding:7px 15px;font-size:12px}.tools button.active{color:#366abd;background:#f0f5fd;border-color:#cbdcf3}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.icon-card{min-height:164px;padding:22px 20px 19px;background:white;border:1px solid #e3e9f2;border-radius:12px;text-align:left;display:flex;flex-direction:column;transition:border-color .15s,background .15s}.icon-card:hover{border-color:#9fbee7}.icon-card.active{background:#f3f7fe;border-color:#a8c4ec}.icon-view{display:flex;align-items:center;justify-content:center;width:38px;height:38px;color:#517ebc;background:#f2f6fd;border-radius:9px;margin-bottom:15px}.icon-view svg{width:23px;height:23px}.icon-card b{font-size:13px;font-weight:500;color:#586d8b}.icon-card small{margin-top:4px;font-size:10px;color:#97a3b5}.selection{margin:24px 0;border:1px solid #dce6f4;border-radius:12px;background:#f4f8ff;padding:20px;display:flex;align-items:center;gap:18px}.selection>svg{width:40px;height:40px;color:#3e75c3;flex:none}.selection b{font-size:15px;font-weight:500}.selection p{font-size:12px;margin-top:4px}.selection code{display:inline-block;font-size:11px;color:#7391b8;margin-top:5px}.note{font-size:11px;line-height:1.9;margin:23px 0;color:#9aa7b9}svg{display:block}.weight-2 .icon-view svg{stroke-width:2}.weight-2 .selection>svg{stroke-width:2}.mono .icon-view{background:#f0f2f5;color:#687589}.mono .selection>svg{color:#687589}@media(max-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.page{padding:24px}.icon-card{padding:20px 16px}.icon-card small{font-size:10px}}@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.page{padding:20px}.icon-card{min-height:156px}.tools{flex-wrap:wrap;gap:8px}.tools button{padding:8px 12px}.selection{padding:17px;align-items:start}h1{font-size:25px}.selection p{font-size:11px}}
</style></head><body><main class="page"><header><b>教学视频助手 / 图标</b><a href="index.html">返回原型 ↗</a></header><h1>让每个入口，一眼能认。</h1><p>16 个教学与制作图标，统一使用 24 × 24 网格、圆角端点与线宽。点击查看推荐用途。</p><div class="tools"><span>线宽</span><button id="weight-16" class="active" aria-pressed="true">1.6 px</button><button id="weight-2" aria-pressed="false">2 px</button><span>配色</span><button id="color-blue" class="active" aria-pressed="true">教学蓝</button><button id="color-mono" aria-pressed="false">中性灰</button></div><div class="grid"><button class="icon-card" data-icon="make" aria-pressed="false"><span class="icon-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 9 5 3-5 3Z"/></svg></span><b>视频制作</b><small>主创作入口、视频卡片</small></button><button class="icon-card" data-icon="videos" aria-pressed="false"><span class="icon-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="16" height="16" rx="3"/><path d="M16 2H5a3 3 0 0 0-3 3v11m9-6 5 3-5 3Z"/></svg></span><b>视频库</b><small>已完成视频、历史版本</small></button><button class="icon-card" data-icon="drafts" aria-pressed="false"><span class="icon-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h6l2-3h6a2 2 0 0 1 2 2v13H4Z"/><path d="M4 10h16m-11 5h6"/></svg></span><b>草稿</b><small>保存中、未完成项目</small></button><button class="icon-card" data-icon="prefs" aria-pressed="false"><span class="icon-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></svg></span><b>制作设置</b><small>参数调整、个性偏好</small></button><button class="icon-card" data-icon="account" aria-pressed="false"><span class="icon-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span><b>教师账户</b><small>账户信息、用户管理</small></button><button class="icon-card" data-icon="book" aria-pressed="false"><span class="icon-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-4-1-7-1-10 1Zm0 0v15"/></svg></span><b>教学内容</b><small>学科、教材与知识点</small></button><button class="icon-card" data-icon="cap" aria-pressed="false"><span class="icon-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 9 10-5 10 5-10 5Zm4 2v6q6 5 12 0v-6m4-2v8"/></svg></span><b>年级</b><small>学生对象、年级选择</small></button><button class="icon-card" data-icon="clock" aria-pressed="false"><span class="icon-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><b>时长</b><small>视频时长、段落时长</small></button><button class="icon-card" data-icon="frame" aria-pressed="false"><span class="icon-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h3m-3 0v3m10 3h-3m3 0v-3"/></svg></span><b>画幅</b><small>横屏、竖屏、画面比例</small></button><button class="icon-card" data-icon="voice" aria-pressed="false"><span class="icon-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 5-5 4H3v6h3l5 4Zm4 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></span><b>配音</b><small>系统声音、音频说明</small></button><button class="icon-card" data-icon="attach" aria-pressed="false"><span class="icon-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 12 6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l8-8m-3 9 4-4"/></svg></span><b>参考资料</b><small>上传课件、文件附件</small></button><button class="icon-card" data-icon="outline" aria-pressed="false"><span class="icon-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11M9 12h11M9 19h11M3 5h1M3 12h1M3 19h1"/></svg></span><b>大纲</b><small>章节结构、内容梳理</small></button><button class="icon-card" data-icon="board" aria-pressed="false"><span class="icon-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="m8 22 4-5 4 5M7 8h5m-5 4h10"/></svg></span><b>教学画面</b><small>分镜、动画、画面编辑</small></button><button class="icon-card" data-icon="experiment" aria-pressed="false"><span class="icon-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6m-5 0v6l-6 10q-1 2 2 2h12q3 0 2-2L14 9V3M8 14h8m-5 3h2"/></svg></span><b>实验演示</b><small>物理、化学内容的示意图标</small></button><button class="icon-card" data-icon="leaf" aria-pressed="false"><span class="icon-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 3C5 2 2 10 6 16s15 3 14-13ZM5 21 16 9"/></svg></span><b>自然学科</b><small>生物与环境内容的示意图标</small></button><button class="icon-card" data-icon="save" aria-pressed="false"><span class="icon-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h13l4 4v14H3V3Zm3 0v6h10V3M7 21v-8h10v8"/></svg></span><b>保存</b><small>保存草稿、保存编辑</small></button></div><div class="selection" aria-live="polite" id="selection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-4-1-7-1-10 1Zm0 0v15"/></svg><div><b>教学内容</b><p>学科、教材与知识点</p></div></div><p class="note">书本与播放符号组成产品标记。实验与自然图标保留为学科扩展候选，其余图标已用于第三轮原型的导航、参数与操作。全部为内联 SVG，无外部图标依赖。</p></main><script>
const icons={"make": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"3\"/><path d=\"m10 9 5 3-5 3Z\"/>", "videos": "<rect x=\"5\" y=\"5\" width=\"16\" height=\"16\" rx=\"3\"/><path d=\"M16 2H5a3 3 0 0 0-3 3v11m9-6 5 3-5 3Z\"/>", "drafts": "<path d=\"M4 7h6l2-3h6a2 2 0 0 1 2 2v13H4Z\"/><path d=\"M4 10h16m-11 5h6\"/>", "prefs": "<path d=\"M4 7h16M4 17h16\"/><circle cx=\"8\" cy=\"7\" r=\"3\"/><circle cx=\"16\" cy=\"17\" r=\"3\"/>", "account": "<circle cx=\"12\" cy=\"8\" r=\"3.5\"/><path d=\"M5 21v-2a7 7 0 0 1 14 0v2\"/>", "book": "<path d=\"M12 5c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-4-1-7-1-10 1Zm0 0v15\"/>", "cap": "<path d=\"m2 9 10-5 10 5-10 5Zm4 2v6q6 5 12 0v-6m4-2v8\"/>", "clock": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>", "frame": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M7 9h3m-3 0v3m10 3h-3m3 0v-3\"/>", "voice": "<path d=\"m11 5-5 4H3v6h3l5 4Zm4 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14\"/>", "attach": "<path d=\"m8 12 6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l8-8m-3 9 4-4\"/>", "outline": "<path d=\"M9 5h11M9 12h11M9 19h11M3 5h1M3 12h1M3 19h1\"/>", "chevron": "<path d=\"m6 9 6 6 6-6\"/>", "plus": "<path d=\"M12 5v14M5 12h14\"/>", "home": "<path d=\"m3 10 9-7 9 7v10H3Zm6 10v-7h6v7\"/>", "board": "<rect x=\"3\" y=\"3\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"m8 22 4-5 4 5M7 8h5m-5 4h10\"/>", "experiment": "<path d=\"M9 3h6m-5 0v6l-6 10q-1 2 2 2h12q3 0 2-2L14 9V3M8 14h8m-5 3h2\"/>", "leaf": "<path d=\"M20 3C5 2 2 10 6 16s15 3 14-13ZM5 21 16 9\"/>", "save": "<path d=\"M4 3h13l4 4v14H3V3Zm3 0v6h10V3M7 21v-8h10v8\"/>"},labels={"make": ["视频制作", "主创作入口、视频卡片"], "videos": ["视频库", "已完成视频、历史版本"], "drafts": ["草稿", "保存中、未完成项目"], "prefs": ["制作设置", "参数调整、个性偏好"], "account": ["教师账户", "账户信息、用户管理"], "book": ["教学内容", "学科、教材与知识点"], "cap": ["年级", "学生对象、年级选择"], "clock": ["时长", "视频时长、段落时长"], "frame": ["画幅", "横屏、竖屏、画面比例"], "voice": ["配音", "系统声音、音频说明"], "attach": ["参考资料", "上传课件、文件附件"], "outline": ["大纲", "章节结构、内容梳理"], "board": ["教学画面", "分镜、动画、画面编辑"], "experiment": ["实验演示", "物理、化学内容的示意图标"], "leaf": ["自然学科", "生物与环境内容的示意图标"], "save": ["保存", "保存草稿、保存编辑"]};
function choose(key){document.querySelectorAll('[data-icon]').forEach(b=>{b.classList.toggle('active',b.dataset.icon===key);b.setAttribute('aria-pressed',String(b.dataset.icon===key))});document.getElementById('selection').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+icons[key]+'</svg><div><b>'+labels[key][0]+'</b><p>'+labels[key][1]+'</p><code>'+key+' · 24 × 24</code></div>'}
document.querySelectorAll('[data-icon]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.icon)));
for(const [ids,callback] of [[['weight-16','weight-2'],i=>document.body.classList.toggle('weight-2',i===1)],[['color-blue','color-mono'],i=>document.body.classList.toggle('mono',i===1)]])ids.forEach((id,i)=>document.getElementById(id).addEventListener('click',()=>{ids.forEach(k=>{document.getElementById(k).classList.toggle('active',k===id);document.getElementById(k).setAttribute('aria-pressed',String(k===id))});callback(i)}));choose('book');
</script></body></html>
