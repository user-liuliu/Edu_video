function aside(){return '<aside class="design-aside"><div><div class="preview-label"><span>让知识拥有画面</span><span>VISUAL STORY</span></div><div class="preview-frame">'+artwork()+'<div class="preview-caption"><span>一节课，一次新的发现</span><small>画面示意</small></div></div></div><section class="aside-section"><h3>三步，把想法变成视频</h3>'+[['写下教学需求','告诉我们，你想讲什么。'],['打磨大纲与讲稿','逐段编辑、审核，再由你确认。'],['预览画面，导出视频','核对动画与配音，满意后导出。']].map((x,i)=>'<div class="flow-item"><span class="flow-num">0'+(i+1)+'</span><div>'+x[0]+'<p>'+x[1]+'</p></div></div>').join('')+'</section><div class="aside-tip">'+icon('bulb')+'<p>好的需求，来自具体的课堂。<br>写清学生、知识点和想解决的问题，<br>比一段复杂的提示词更有帮助。</p></div></aside>'}
function createView(){return heading('CREATE A LESSON / 01',concepts[theme][1],concepts[theme][2])+steps(0)+'<div class="create-grid"><form class="panel form-panel" id="creation-form"><div class="panel-head"><h2><span class="number">01</span>这节课，想讲些什么？</h2><span class="panel-kicker">教学需求</span></div><label class="field"><span>项目名称 <small class="required">必填</small></span><input class="input" data-field="title" name="project-title" maxlength="200" required value="'+esc(state.title)+'" placeholder="给这节课起个名字"></label><label class="field"><span>想讲什么 <small class="required">必填</small></span><textarea class="textarea" data-field="prompt" maxlength="20000" required aria-describedby="prompt-help">'+esc(state.prompt)+'</textarea><div class="field-foot"><small id="prompt-help">建议包含教学对象、核心知识点与期望的讲解方式</small><small id="prompt-count">'+state.prompt.length+' / 20,000</small></div></label><div class="field"><span>参考素材 <small class="small-note">可选</small></span><button type="button" class="upload-box" data-action="upload" id="drop-zone"><span class="upload-icon">'+icon('upload')+'</span><span><b>点击上传，或拖入你的教学资料</b><small>PPT / PDF / Word / 图片 · 单个 25 MiB · 最多 10 个</small></span></button><input type="file" id="file-input" accept=".ppt,.pptx,.pdf,.doc,.docx,.png,.jpg,.jpeg,.webp" multiple hidden><div class="file-list">'+state.files.map((f,i)=>'<div class="file-item">'+icon('file')+'<span>'+esc(f.name)+'</span><small>'+(f.size/1024).toFixed(0)+' KB</small><button type="button" data-action="remove-file" data-index="'+i+'" aria-label="移除 '+esc(f.name)+'">'+icon('close')+'</button></div>').join('')+'</div></div><div class="divider"></div><div class="panel-head"><h2><span class="number">02</span>为你的课堂，调好参数。</h2><span class="panel-kicker">创作设置</span></div><div class="parameters">'+selectField('科目','subject',['数学','物理','化学','生物','语文','英语','历史','地理','道德与法治'])+selectField('年级','grade',['一年级','二年级','三年级','四年级','五年级','六年级','初一','初二','初三','高一','高二','高三'])+selectField('教材版本','edition',['人教版','北师大版','苏教版','沪教版',...(['语文','历史','道德与法治'].includes(state.subject)?['统编版']:[])])+selectField('视频时长','duration',['3 分钟','5 分钟','10 分钟','自定义'])+selectField('视频尺寸','ratio',['16:9 横屏','9:16 竖屏','1:1 方形'])+selectField('配音声音','voice',['系统中文配音'])+'</div><div class="search-row"><div><strong>'+icon('globe')+'允许联网搜索</strong><p>'+(state.search?'可补充公开资料，来源仍需教师核实。':'关闭后仅使用上传素材与模型知识；无可靠依据的内容标明“未核实出处”。')+'</p></div><button type="button" class="switch" role="switch" aria-label="允许联网搜索" aria-checked="'+state.search+'" data-action="search"></button></div><div class="notice">系统配音在服务器离线生成，不消耗配音模型额度；预览与导出使用同一份配音。此处仅演示选项，不生成实际配音。</div><div class="form-actions"><span class="small-note" id="save-state">'+(state.saved?'✓ 本次演示草稿已保存':'灵感可以先存为草稿，稍后继续。')+'</span><div class="action-group"><button type="button" class="btn" data-action="save-draft">保存草稿</button><button type="submit" class="btn primary">生成大纲 '+icon('arrow')+'</button></div></div></form>'+aside()+'</div>'+footer()}
function defaultSegments(){return [['从一次投篮说起','观察篮球运动轨迹，建立抛物线的直观印象。','同学们，想象一下你在球场上投篮。篮球离开手心，先上升，再下降，在空中划出一条优美的曲线。你有没有想过，这条曲线可以用数学语言来描述？今天，我们就从这次投篮出发，一起认识二次函数。','学科示意图','展示篮球从手中抛出到篮筐的轨迹，逐渐叠加坐标轴，突出曲线的上升与下降。'],['认识二次函数','理解二次函数的一般形式及系数的意义。','形如 y=ax²+bx+c 的函数，叫做二次函数，其中 a 不能等于零。最高次数是二，这是它与一次函数的区别。二次函数的图像是一条抛物线，系数 a 的正负决定它的开口方向。','公式','逐步显示一般形式，突出 a 不为零，比较开口向上与开口向下的图像。'],['寻找对称轴与顶点','结合图像识别对称轴与顶点。','请观察这条抛物线。沿着一条竖直线对折，左右两边恰好重合，这条直线就是对称轴。对称轴与抛物线的交点叫顶点。想一想：篮球到达最高点时，在图像上对应哪个位置？','数学图形','沿对称轴折叠曲线，突出顶点，标注对称轴 x=-b/(2a)。'],['回到生活，检验理解','用投篮情境巩固开口方向、顶点与对称轴。','现在回到最初的投篮。篮球轨迹的抛物线开口向下，最高点对应顶点。用自己的话说说，如何从图像判断开口方向？找一个生活中的抛物线，和同桌分享你的发现吧。','文字卡','用三张知识卡片总结开口方向、对称轴与顶点。']].map((s,i)=>({id:i+1,title:s[0],objective:s[1],narration:s[2],kind:'知识讲解',visuals:[{kind:s[3],description:s[4]}],review:'passed',seconds:[50,75,80,55][i]}))}
function outlineView(){if(!state.segments.length)state.segments=defaultSegments();const s=state.segments[state.activeSegment],pending=state.segments.filter(s=>s.review!=='passed').length;return heading('SHAPE YOUR STORY / 02','让每一段讲解，恰到好处。','逐段打磨教学目标、讲稿和画面。AI 审核后，仍需要你做最终判断。','<button class="btn" data-action="back-create">返回需求</button>')+steps(1)+'<div class="toolbar"><p>'+state.segments.length+' 个段落 · 预计 '+state.segments.reduce((a,s)=>a+s.seconds,0)+' 秒 · '+(pending?'待审核 '+pending+' 段':'全部 AI 已审核')+(state.outlineSaved?' · 已保存':' · 有未保存内容')+'</p><div class="action-group"><button class="btn" data-action="save-outline">保存大纲</button><button class="btn" data-action="review" '+(!pending?'disabled':'')+'>审核待处理片段</button><button class="btn primary" data-action="confirm-outline">'+(state.confirmed?'进入视频预览':'确认大纲')+' '+icon('arrow')+'</button></div></div><div class="outline-layout"><aside class="panel segment-nav">'+state.segments.map((x,i)=>'<div style="display:flex;align-items:center;gap:4px"><input class="segment-check" type="checkbox" data-select-segment="'+i+'" aria-label="选择段落 '+(i+1)+'" '+(state.selected.includes(x.id)?'checked':'')+'><button class="segment-link '+(i===state.activeSegment?'active':'')+'" data-action="segment" data-index="'+i+'"><span class="flow-num">'+String(i+1).padStart(2,'0')+'</span><span>'+esc(x.title)+'<small>'+x.seconds+' 秒 · '+(x.review==='passed'?'AI 已审核':'待审核')+'</small></span></button></div>').join('')+'<button class="btn quiet" data-action="add-segment">＋ 添加段落</button></aside><section><article class="panel segment-editor"><div class="panel-head"><h2>片段 '+String(state.activeSegment+1).padStart(2,'0')+'</h2><span class="badge '+(s.review==='passed'?'':'pending')+'">'+(s.review==='passed'?'✓ AI 已审核':'○ 待审核')+'</span></div><div class="field-pair"><label class="field"><span>段落标题</span><input class="input" data-segment-field="title" value="'+esc(s.title)+'"></label><label class="field"><span>内容性质</span><select class="select" data-segment-field="kind">'+opts(['知识讲解','事实陈述','情景演绎'],s.kind)+'</select></label></div><label class="field"><span>教学目标</span><input class="input" data-segment-field="objective" value="'+esc(s.objective)+'"></label><label class="field"><span>完整逐字稿 <small class="small-note">预计 '+s.seconds+' 秒</small></span><textarea class="textarea" data-segment-field="narration">'+esc(s.narration)+'</textarea></label><div class="field"><span>画面说明</span><p class="hint" style="margin-bottom:12px">写清展示什么、发生什么变化、希望学生理解什么即可。</p>'+s.visuals.map((v,i)=>'<div class="visual-row"><select class="select" data-visual-kind="'+i+'" aria-label="画面类型 '+(i+1)+'">'+opts(['插图','数学图形','公式','学科示意图','文字卡'],v.kind)+'</select><textarea class="textarea" data-visual-description="'+i+'" aria-label="画面描述 '+(i+1)+'">'+esc(v.description)+'</textarea><button class="icon-btn" data-action="remove-visual" data-index="'+i+'" aria-label="移除画面 '+(i+1)+'" '+(s.visuals.length<=1?'disabled':'')+'>'+icon('close')+'</button></div>').join('')+'<button class="btn quiet small" data-action="add-visual">＋ 添加画面</button></div><div class="notice">内容依据：<button data-action="evidence" style="color:var(--primary);text-decoration:underline">查看演示来源</button> · AI 审核仅针对大纲内容，视频生成后仍需核对画面与配音。</div><div class="segment-actions"><div class="action-group"><button class="btn small" data-action="move-up" '+(!state.activeSegment?'disabled':'')+'>↑ 上移</button><button class="btn small" data-action="move-down" '+(state.activeSegment===state.segments.length-1?'disabled':'')+'>↓ 下移</button></div><button class="btn quiet danger small" data-action="delete-segment" '+(state.segments.length<=1?'disabled':'')+'>删除段落</button></div></article><section class="panel rewrite"><h2>局部改写</h2><p class="hint" id="rewrite-count">已选择 '+state.selected.length+' 个段落 · 只改写勾选内容</p><textarea class="textarea" id="rewrite-instruction" aria-label="局部改写要求" placeholder="例如：讲得更口语化，多用生活实例，保留公式。"></textarea><button class="btn" data-action="rewrite">'+icon('spark')+'改写选中段落</button></section></section></div>'+footer()}
function previewView(){return heading('BRING IT TO LIFE / 03','知识，有了自己的画面。',esc(state.title)+' · 核对动画与配音，满意后再导出。','<button class="btn" data-action="back-outline">返回大纲</button>')+steps(2)+(state.previewReady?'<div class="toolbar"><label class="version"><span>视频版本</span><select class="select" id="version-select" aria-label="视频版本">'+Array.from({length:state.versions},(_,i)=>'<option value="'+(i+1)+'" '+(state.version===i+1?'selected':'')+'>版本 '+(i+1)+(i+1===state.versions?' · 最新版':'')+'</option>').join('')+'</select></label><button class="btn" data-action="generate-video">重新生成视频</button></div><div class="preview-layout"><section><div class="player"><div class="player-stage '+(state.playing?'playing':'')+'" id="player-stage">'+artwork()+'<p class="caption" id="player-caption"></p></div><div class="player-controls"><button class="icon-btn" data-action="play" id="play-button" aria-label="播放演示动画">'+icon('play')+'</button><span class="time" id="current-time">00:00</span><input type="range" class="progress-range" id="video-progress" aria-label="演示播放进度" min="0" max="260" value="'+state.time+'"><span class="time">04:20</span><span class="badge">动画示意 · 无音频</span></div></div><div class="video-actions"><button class="btn" data-action="open-revision">修改这一段</button><button class="btn primary" data-action="export">'+icon('download')+(state.exported?'下载 MP4（演示）':'满意，导出 MP4')+'</button></div><p class="hint">播放 HTML 动画示意，不合成真实视频。修改讲稿请返回大纲，并重新审核。</p>'+(state.revision?revisionView():'')+'</section><aside class="panel chapters"><h2>教学内容</h2>'+state.segments.map((s,i)=>'<button class="chapter" data-action="seek" data-index="'+i+'"><small>'+formatTime(segmentStart(i))+'—'+formatTime(segmentStart(i)+s.seconds)+'</small><strong>'+String(i+1).padStart(2,'0')+' / '+esc(s.title)+'</strong><p>'+esc(s.narration.slice(0,66))+'…</p></button>').join('')+'</aside></div>':'<div class="panel empty">'+icon('make')+'<h2>大纲已确认，开始制作吧。</h2><p>生成后预览动画、核对配音、调整片段，再导出视频。</p><button class="btn primary" data-actio function revisionView(){return '<section class="panel revision"><h2>修改教学片段</h2><div class="settings-tabs" style="margin-top:16px"><button class="btn '+(state.revisionMode==='visual'?'active':'')+'" data-action="revision-mode" data-value="visual" aria-pressed="'+(state.revisionMode==='visual')+'">调整画面</button><button class="btn '+(state.revisionMode==='voice'?'active':'')+'" data-action="revision-mode" data-value="voice" aria-pressed="'+(state.revisionMode==='voice')+'">重做配音</button></div><p class="hint">'+(state.revisionMode==='visual'?'保留配音，按片段要求重新生成画面。整片模式会为保持连贯重新生成整片画面。':'保留讲稿与画面，重新生成选中片段的配音并自动校时。')+'</p>'+state.segments.map((s,i)=>'<label class="check-row"><input type="checkbox" data-revision-segment="'+i+'" '+(state.revisionSelected.includes(i)?'checked':'')+'>'+esc(s.title)+'</label>').join('')+'<label for="revision-instruction" class="hint">'+(state.revisionMode==='visual'?'画面修改要求':'配音表现要求')+'</label><textarea class="textarea" id="revision-instruction" placeholder="'+(state.revisionMode==='visual'?'例如：放慢图像变化，突出对称轴。':'例如：语气自然清晰，重点稍作停顿。')+'"></textarea><div class="action-group"><button class="btn primary" data-action="submit-revision">生成修改版</button><button class="btn" data-action="cancel-revision">取消</button></div></section>'}

case'admin-tab':state.adminTab=a.dataset.value;render();break;case'toggle-config':a.setAttribute('aria-checked',String(a.getAttribute('aria-checked')!=='true'));break;case'toggle-memory':state.prefsEnabled=!state.prefsEnabled;a.setAttribute('aria-checked',String(state.prefsEnabled));break;case'save-config':{const invalid=$$('input[type=number]').find(el=>!el.checkValidity());if(invalid){invalid.reportValidity();break}toast('配置保存交互已演示，不修改业务配置。');break}
case'edit-options':{const select=a.closest('tr').querySelector('select');modal('编辑可选值','<div class="modal-fields"><label class="field"><span>每行一个选项</span><textarea class="textarea" id="config-options">'+esc([...select.options].map(o=>o.text).join('\n'))+'</textarea></label></div>',()=>{const values=$('#config-options').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!values.length){toast('至少保留一个选项。');return false}select.innerHTML=opts(values,'');toast('演示选项已更新。')},'保存选项');break}
case'edit-model':modal('编辑模型 · 占位示例','<div class="modal-fields"><label class="field"><span>接口地址（占位）</span><input class="input" value="https://api.example.invalid/v1" autocomplete="off"></label><label class="field"><span>模型名称</span><input class="input" value="demo-model"></label><label class="field"><span>API Key（请勿输入真实密钥）</span><input class="input" type="password" placeholder="仅演示，请勿输入真实密钥" autocomplete="off"></label></div>',()=>toast('已演示保存，不连接接口或存储密钥。'),'保存示例');break;case'test-model':busy(a,'模拟测试…',()=>{a.disabled=false;a.textContent='测试连接';$('#model-status-'+i).textContent='演示完成 · 未联网';toast('连接测试仅为演示，未发起网络请求。')});break;
case'registration':state.registration=!state.registration;render();toast('开放注册开关已在演示中'+(state.registration?'开启':'关闭'));break;case'user-status':modal('更改演示用户状态？','<p>只更新示例列表中的状态，不修改真实账户。</p>',()=>{state.users[i].status=state.users[i].status==='正常'?'已禁用':'正常';render();toast('演示用户状态已更新。')},'确认更改');break;case'reset-password':modal('重置密码 · '+esc(state.users[i].name),'<div class="modal-fields"><label class="field"><span>新密码（仅演示）</span><input class="input" id="new-password" type="password" minlength="8" autocomplete="off"></label><label class="field"><span>确认新密码</span><input class="input" id="confirm-password" type="password" autocomplete="off"></label></div>',()=>{if($('#new-password').value.length<8||$('#new-password').value!==$('#confirm-password').value){toast('请输入至少 8 位、两次一致的演示密码。');return false}toast('密码重置流程已演示，未保存密码。')},'确认重置');break;
}});
$('#reset-demo').addEventListener('click',()=>modal('重置本页演示？','<p>清空本页临时编辑，恢复初始演示数据。不会影响业务系统。</p>',()=>{clearInterval(playTimer);state=initial();navigate('create');toast('演示已重置。')},'重置演示'));
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if([...teacherNav,...adminNav].some(n=>n[0]===v)||['outline','preview'].includes(v)){if(v==='preview'&&!state.confirmed){toast('请先确认大纲。');navigate('create')}else navigate(v)}});window.addEventListener('popstate',()=>{const v=location.hash.slice(1)||'create';navigate(v)});document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(playTimer);state.playing=false;updatePlayer()}});
const startView=location.hash.slice(1);if([...teacherNav,...adminNav].some(n=>n[0]===startView)){state.view=startView;state.role=startView.startsWith('admin-')?'admin':'teacher'}else if(theme==='studio'){state.view='preview';state.segments=defaultSegments();state.confirmed=true;state.outlineSaved=true;state.previewReady=true}render();
</script>
</body></html>
