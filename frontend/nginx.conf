server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 请求体上限：平台接口都是小 JSON。第 2 部分只在上传素材的 location 上单独放宽
    client_max_body_size 1m;

    # 安全响应头（always：错误响应也带上）
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # proxy_pass 不带 URI，转发时保留 /api/ 前缀（后端路由就是 /api/...）
    # X-Forwarded-For 故意用 $remote_addr 覆盖、不追加：nginx 是唯一入口，客户端自带的 XFF
    # 不可信（否则伪造 IP 就能绕过/嫁祸登录限流）。以后如果前面再加代理或负载均衡，
    # 改用 set_real_ip_from + real_ip_header 还原真实 IP，而不是改回追加。
    location ~ ^/api/projects/[^/]+/materials$ {
        client_max_body_size 26m;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端路由（history 模式）：找不到的路径都回落到 index.html
    location / {
        try_files $uri /index.html;
    }
}
